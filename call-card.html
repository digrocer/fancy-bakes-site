<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fancy Bakes &amp; More — Call Card</title>
<meta name="description" content="Shareable, print-ready call card for Fancy Bakes and More — Madina Ritz Junction.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,700;1,500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{ --p:#6A1B9A; --s:#D81B8C; --a:#E0B341; }
  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:'Inter',sans-serif;background:#e9e2d4;min-height:100vh;display:grid;place-items:center;padding:28px;color:#241226}
  .sheet{width:100%;max-width:720px}
  .actions{display:flex;justify-content:flex-end;margin-bottom:14px}
  .print-btn{display:inline-flex;align-items:center;gap:8px;padding:10px 18px;border:none;border-radius:999px;
    background:linear-gradient(135deg,var(--s),var(--p));color:#fff;font-weight:600;font-size:.86rem;cursor:pointer;
    box-shadow:0 8px 20px -8px var(--s);transition:transform .15s}
  .print-btn:hover{transform:translateY(-2px)}
  .poster{background:linear-gradient(160deg,#fbf6ec,#f6ecda);border:1px solid #ece0c8;border-radius:26px;
    padding:clamp(26px,4vw,46px);text-align:center;box-shadow:0 26px 60px -28px rgba(40,15,45,.4)}
  .word{font-family:'Playfair Display',serif;color:var(--p);font-size:clamp(2rem,6vw,3.1rem);line-height:1.04;font-weight:700}
  .logo svg{width:clamp(96px,16vw,124px);height:auto;margin:10px auto 4px;display:block}
  .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:26px 0}
  .tile{aspect-ratio:4/3;border-radius:14px;background:#fffaf3;border:1px solid #f0e6d4;display:grid;place-items:center;
    box-shadow:0 2px 10px rgba(40,15,45,.06)}
  .tile:nth-child(even){background:#f7efe0}
  .tile svg{width:80%;height:auto}
  .foot{display:flex;justify-content:space-between;align-items:flex-end;gap:22px;flex-wrap:wrap;text-align:left;margin-top:4px}
  .tag{font-family:'Playfair Display',serif;font-style:italic;color:var(--s);font-size:clamp(1.4rem,4vw,2.1rem)}
  .contact{font-size:.92rem;line-height:1.8;font-weight:500}
  .contact span{color:var(--p);font-weight:600}
  @media print{
    body{background:#fff;padding:0}
    .actions{display:none}
    .poster{box-shadow:none;border-radius:0;border:none}
  }
</style>
</head>
<body>
<div class="sheet">
  <div class="actions">
    <button class="print-btn" onclick="window.print()">⎙ Print / Save as PDF</button>
  </div>
  <section class="poster">
    <div class="word">Fancy Bakes and More</div>
    <div class="logo" id="logo"></div>
    <div class="grid" id="grid"></div>
    <div class="foot">
      <div class="tag">Delight in every bite</div>
      <div class="contact">
        <span>Call:</span> 020-5723239<br>
        <span>Location:</span> Madina Ritz Junction<br>
        <span>Facebook:</span> Fancy Bakes and More<br>
        <span>Instagram:</span> fancybakes_andmore
      </div>
    </div>
  </section>
</div>

<script>
/* Self-contained art — same marks used in the Brand Studio, baked to the
   signature "Berry Mix" palette so the card is a faithful, print-ready copy. */
const P='#6A1B9A', S='#D81B8C', A='#E0B341';
const clamp=(n,a,b)=>Math.max(a,Math.min(b,n));
function hexToRgb(h){h=h.replace('#','');return{r:parseInt(h.substr(0,2),16),g:parseInt(h.substr(2,2),16),b:parseInt(h.substr(4,2),16)};}
function rgbToHex(r,g,b){const t=v=>clamp(Math.round(v),0,255).toString(16).padStart(2,'0');return '#'+t(r)+t(g)+t(b);}
function mix(a,b,t){const x=hexToRgb(a),y=hexToRgb(b);return rgbToHex(x.r+(y.r-x.r)*t,x.g+(y.g-x.g)*t,x.b+(y.b-x.b)*t);}

function logoSVG(p,s,a){
  const disc=mix(a,'#ffffff',0.9), cream='#ffffff';
  return `<svg viewBox="0 0 220 220" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Fancy Bakes and More logo">
  <circle cx="110" cy="110" r="105" fill="${disc}"/>
  <circle cx="110" cy="110" r="105" fill="none" stroke="${a}" stroke-width="3.5"/>
  <circle cx="110" cy="110" r="94" fill="none" stroke="${a}" stroke-width="1.4" opacity=".75"/>
  <g><circle cx="98" cy="62" r="13" fill="${cream}"/><circle cx="122" cy="62" r="13" fill="${cream}"/><circle cx="110" cy="54" r="16" fill="${cream}"/>
  <rect x="92" y="66" width="36" height="16" rx="4" fill="${cream}"/><rect x="92" y="74" width="36" height="3" fill="${a}" opacity=".5"/></g>
  <rect x="84" y="86" width="52" height="22" rx="6" fill="${p}"/><rect x="84" y="86" width="52" height="8" rx="4" fill="${cream}"/>
  <rect x="74" y="106" width="72" height="26" rx="7" fill="${s}"/><rect x="74" y="106" width="72" height="9" rx="4" fill="${cream}"/>
  <rect x="64" y="130" width="92" height="30" rx="8" fill="${p}"/><rect x="64" y="130" width="92" height="10" rx="5" fill="${cream}"/>
  <circle cx="100" cy="120" r="2.6" fill="${cream}" opacity=".8"/><circle cx="120" cy="124" r="2.6" fill="${cream}" opacity=".8"/>
  <circle cx="85" cy="148" r="3" fill="${cream}" opacity=".8"/><circle cx="110" cy="150" r="3" fill="${cream}" opacity=".8"/><circle cx="135" cy="148" r="3" fill="${cream}" opacity=".8"/>
  <circle cx="110" cy="80" r="5" fill="${a}"/>
  <rect x="52" y="166" width="116" height="12" rx="6" fill="${s}"/><circle cx="48" cy="172" r="6.5" fill="${p}"/><circle cx="172" cy="172" r="6.5" fill="${p}"/>
</svg>`;
}

function cakeArt(i,p,s,a){
  const cr='#fffaf3', sp=mix(s,'#ffffff',0.22), pl=mix(p,'#1a0f1e',0.20);
  const drip=(x)=>`<path d="M${x} 50 v7 a3 3 0 0 0 6 0 v-7 z" fill="${sp}"/>`;
  const open='<svg viewBox="0 0 120 96" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Fancy Bakes cake illustration">';
  const plate='<ellipse cx="60" cy="87" rx="38" ry="5" fill="rgba(40,15,45,.10)"/>';
  const arts=[
    `${open}${plate}<rect x="30" y="48" width="60" height="35" rx="8" fill="${p}"/><rect x="30" y="66" width="60" height="3" fill="${pl}" opacity=".5"/><rect x="30" y="44" width="60" height="10" rx="5" fill="${sp}"/>${[33,45,57,69,81].map(drip).join('')}<circle cx="50" cy="40" r="5" fill="${s}"/><circle cx="61" cy="37" r="6" fill="${p}"/><circle cx="72" cy="40" r="5" fill="${s}"/><circle cx="61" cy="29" r="3" fill="${a}"/><rect x="60" y="25" width="2" height="6" rx="1" fill="${pl}"/></svg>`,
    `${open}${plate}<rect x="32" y="58" width="56" height="25" rx="7" fill="${p}"/><rect x="32" y="58" width="56" height="8" rx="4" fill="${sp}"/><rect x="44" y="38" width="32" height="22" rx="6" fill="${s}"/><rect x="44" y="38" width="32" height="7" rx="3" fill="${sp}"/><circle cx="50" cy="36" r="4" fill="${cr}"/><circle cx="60" cy="34" r="4.5" fill="${cr}"/><circle cx="70" cy="36" r="4" fill="${cr}"/><circle cx="50" cy="36" r="1.6" fill="${a}"/><circle cx="60" cy="34" r="1.6" fill="${a}"/><circle cx="70" cy="36" r="1.6" fill="${a}"/><circle cx="40" cy="70" r="2" fill="${cr}"/><circle cx="60" cy="74" r="2" fill="${cr}"/><circle cx="80" cy="70" r="2" fill="${cr}"/></svg>`,
    `${open}${plate}<path d="M44 60 L76 60 L72 84 Q60 88 48 84 Z" fill="${p}"/><path d="M50 60 L48 84 M58 60 L57 86 M66 60 L67 86 M74 60 L72 84" stroke="${pl}" stroke-width="1.4" opacity=".5"/><ellipse cx="60" cy="58" rx="19" ry="8" fill="${sp}"/><ellipse cx="60" cy="50" rx="14" ry="7" fill="${s}"/><ellipse cx="60" cy="43" rx="9" ry="6" fill="${sp}"/><circle cx="60" cy="34" r="4" fill="${a}"/><circle cx="54" cy="55" r="1.5" fill="${a}"/><circle cx="66" cy="56" r="1.5" fill="${cr}"/><circle cx="60" cy="49" r="1.5" fill="${a}"/></svg>`,
    `${open}${plate}<rect x="30" y="52" width="60" height="31" rx="8" fill="${s}"/><rect x="30" y="48" width="60" height="10" rx="5" fill="${sp}"/>${[33,45,57,69,81].map(x=>`<path d="M${x} 54 v6 a3 3 0 0 0 6 0 v-6 z" fill="${sp}"/>`).join('')}<circle cx="44" cy="70" r="2.4" fill="${cr}"/><circle cx="60" cy="74" r="2.4" fill="${cr}"/><circle cx="76" cy="70" r="2.4" fill="${cr}"/><rect x="58" y="30" width="4" height="18" rx="2" fill="${p}"/><rect x="58" y="34" width="4" height="3" fill="${cr}"/><path d="M60 22 q4 4 0 8 q-4 -4 0 -8 z" fill="${a}"/></svg>`,
    `${open}${plate}<ellipse cx="54" cy="72" rx="17" ry="13" fill="${p}"/><ellipse cx="68" cy="58" rx="17" ry="13" fill="${s}"/><ellipse cx="58" cy="44" rx="17" ry="13" fill="${p}"/><circle cx="52" cy="42" r="2" fill="${a}"/><circle cx="63" cy="46" r="2" fill="${a}"/><circle cx="58" cy="48" r="2" fill="${pl}"/><circle cx="64" cy="56" r="2" fill="${a}"/><circle cx="72" cy="60" r="2" fill="${cr}"/><circle cx="50" cy="70" r="2" fill="${a}"/><circle cx="58" cy="74" r="2" fill="${cr}"/></svg>`,
    `${open}${plate}<circle cx="60" cy="58" r="25" fill="${p}"/><path d="M38 50 a25 25 0 0 1 44 0 a10 10 0 0 1 -8 8 a14 14 0 0 0 -28 0 a10 10 0 0 1 -8 -8 z" fill="${s}"/><circle cx="60" cy="58" r="9" fill="${cr}"/><rect x="48" y="44" width="5" height="2" rx="1" fill="${a}" transform="rotate(20 50 45)"/><rect x="64" y="42" width="5" height="2" rx="1" fill="${cr}" transform="rotate(-25 66 43)"/><rect x="70" y="52" width="5" height="2" rx="1" fill="${a}" transform="rotate(40 72 53)"/><rect x="50" y="54" width="5" height="2" rx="1" fill="${cr}" transform="rotate(-10 52 55)"/></svg>`,
  ];
  return arts[((i%arts.length)+arts.length)%arts.length];
}

document.getElementById('logo').innerHTML = logoSVG(P,S,A);
document.getElementById('grid').innerHTML = [0,1,2,3,4,5].map(i=>`<div class="tile">${cakeArt(i,P,S,A)}</div>`).join('');
</script>
</body>
</html>
